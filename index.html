<!DOCTYPE html>
<html lang="id" class="h-full">
<head>

    <!-- PWA Manifest & Theme Color -->

    <!-- Tailwind CSS CDN -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbe1',
                            100: '#fff3b8',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;

            background: #cbd5e1;

</head>

    <!-- JS -->
    <script>
        let notes = JSON.parse(localStorage.getItem('app_notes')) || [];
        let tasks = JSON.parse(localStorage.getItem('app_tasks')) || [];
        let currentTab = 'notes';
        let searchQuery = '';
        let categoryFilter = 'All';
        let priorityFilter = 'All';
        let noteAttachmentFiles = [];
        let taskAttachmentFiles = [];
        let syncUrl = localStorage.getItem('app_script_url') || '';

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateSyncIndicator();
            renderAll();
        });

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fas fa-sun text-amber-400';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fas fa-moon text-slate-600';
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                document.getElementById('themeIcon').className = 'fas fa-moon text-slate-600';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('themeIcon').className = 'fas fa-sun text-amber-400';
            }
        }

        function updateSyncIndicator() {
            const ind = document.getElementById('syncIndicator');
            if (syncUrl && syncUrl.trim() !== '') {
                ind.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
            } else {
                ind.className = 'w-2.5 h-2.5 rounded-full bg-slate-400';
            }
        }

        function syncToSheets(payload) {
            if (!syncUrl || syncUrl.trim() === '') return;
            fetch(syncUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(() => {
                updateSyncIndicator();
            }).catch(err => {
                console.error('Sync error:', err);
                document.getElementById('syncIndicator').className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
            });
        }

        function testSyncConnection() {
            const url = document.getElementById('scriptUrlInput').value.trim();
            const log = document.getElementById('syncStatusLog');
            if (!url) { log.textContent = 'URL kosong!'; return; }
            log.textContent = 'Mengirim tes sinkronisasi...';
            
            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'ping', test: true, createdAt: new Date().toLocaleString() })
            }).then(() => {
                log.textContent = 'Berhasil dikirim! Cek Spreadsheet Anda.';
                showToast('Tes sinkronisasi terkirim!');
            }).catch(err => {
                log.textContent = 'Gagal: ' + err.toString();
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            const notesBtn = document.getElementById('tabBtnNotes');
            const tasksBtn = document.getElementById('tabBtnTasks');
            const notesSec = document.getElementById('notesSection');
            const tasksSec = document.getElementById('tasksSection');

            if (tab === 'notes') {
                notesBtn.className = "px-4 py-2 rounded-md text-sm font-semibold transition bg-white dark:bg-slate-800 text-amber-600 dark:text-amber-400 shadow-sm";
                tasksBtn.className = "px-4 py-2 rounded-md text-sm font-semibold transition text-slate-600 dark:text-slate-300";
                notesSec.classList.remove('hidden');
                tasksSec.classList.add('hidden');
            } else {
                tasksBtn.className = "px-4 py-2 rounded-md text-sm font-semibold transition bg-white dark:bg-slate-800 text-amber-600 dark:text-amber-400 shadow-sm";
                notesBtn.className = "px-4 py-2 rounded-md text-sm font-semibold transition text-slate-600 dark:text-slate-300";
                tasksSec.classList.remove('hidden');
                notesSec.classList.add('hidden');
            }
            renderAll();
        }

        function openCurrentTabModal() {
            if (currentTab === 'notes') openNoteModal();
            else openTaskModal();
        }

        function handleSearch(e) { searchQuery = e.target.value; renderAll(); }
        function handleCategoryFilter(e) { categoryFilter = e.target.value; renderAll(); }
        function handlePriorityFilter(e) { priorityFilter = e.target.value; renderAll(); }

        async function handleFileSelect(e, type) {
            const files = Array.from(e.target.files);
            const list = type === 'note' ? noteAttachmentFiles : taskAttachmentFiles;
            for (const file of files) {
                const base64 = await readFileAsBase64(file);
                list.push({ id: Date.now().toString(), name: file.name, size: formatFileSize(file.size), data: base64 });
            }
            renderFilePreviews(type);
            showToast('File dilampirkan!');
            e.target.value = '';
        }

        function readFileAsBase64(file) {
            return new Promise((res, rej) => {
                const reader = new FileReader();
                reader.onload = () => res(reader.result);
                reader.onerror = err => rej(err);
                reader.readAsDataURL(file);
            });
        }

        function removeAttachment(id, type) {
            if (type === 'note') {
                noteAttachmentFiles = noteAttachmentFiles.filter(f => f.id !== id);
                renderFilePreviews('note');
            } else {
                taskAttachmentFiles = taskAttachmentFiles.filter(f => f.id !== id);
                renderFilePreviews('task');
            }
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function renderFilePreviews(type) {
            const container = document.getElementById(type === 'note' ? 'noteFilePreview' : 'taskFilePreview');
            const list = type === 'note' ? noteAttachmentFiles : taskAttachmentFiles;
            container.innerHTML = list.map(f => `
                <div class="flex items-center justify-between p-2 rounded border text-xs bg-slate-50 dark:bg-slate-700/50">
                    <span class="truncate">${escapeHtml(f.name)}</span>
                    <button type="button" onclick="removeAttachment('${f.id}', '${type}')" class="text-rose-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function renderAttachmentsHTML(att) {
            if (!att || att.length === 0) return '';
            return `<div class="mt-2 pt-2 border-t border-slate-100 dark:border-slate-700 space-y-1">
                ${att.map(f => `<a href="${f.data}" download="${f.name}" class="block text-xs text-amber-600 dark:text-amber-400 truncate hover:underline"><i class="fas fa-file mr-1"></i>${escapeHtml(f.name)} (${f.size})</a>`).join('')}
            </div>`;
        }

        function openNoteModal(id = null) {
            document.getElementById('noteForm').reset();
            document.getElementById('noteId').value = '';
            noteAttachmentFiles = [];
            
            if (id) {
                const note = notes.find(n => n.id === id);
                if (note) {
                    document.getElementById('modalTitle').textContent = 'Edit Catatan';
                    document.getElementById('noteId').value = note.id;
                    document.getElementById('noteTitle').value = note.title;
                    document.getElementById('noteCategory').value = note.category;
                    document.getElementById('notePriority').value = note.priority;
                    document.getElementById('noteContent').value = note.content;
                    document.getElementById('notePinned').checked = note.pinned || false;
                    noteAttachmentFiles = [...(note.attachments || [])];
                    renderFilePreviews('note');
                }
            } else {
                document.getElementById('modalTitle').textContent = 'Tambah Catatan Baru';
            }
            document.getElementById('noteModal').classList.remove('hidden');
        }

        function closeNoteModal() { document.getElementById('noteModal').classList.add('hidden'); }

        function handleSaveNote(e) {
            e.preventDefault();
            const id = document.getElementById('noteId').value;
            const title = document.getElementById('noteTitle').value;
            const category = document.getElementById('noteCategory').value;
            const priority = document.getElementById('notePriority').value;
            const content = document.getElementById('noteContent').value;
            const pinned = document.getElementById('notePinned').checked;
            const createdAt = new Date().toLocaleString();
            const isSyncActive = syncUrl && syncUrl.trim() !== '';

            if (id) {
                const index = notes.findIndex(n => n.id === id);
                if (index !== -1) {
                    notes[index] = {
                        ...notes[index],
                        title, category, priority, content, pinned,
                        attachments: [...noteAttachmentFiles]
                    };
                    if (isSyncActive) {
                        syncToSheets({ action: 'updateNote', note: notes[index] });
                    }
                    showToast('Catatan diperbarui!');
                }
            } else {
                const newId = isSyncActive ? ('NOTE-' + Date.now()) : '';
                const newNote = {
                    id: newId,
                    title, category, priority, content, pinned,
                    attachments: [...noteAttachmentFiles],
                    createdAt
                };
                notes.unshift(newNote);
                if (isSyncActive) {
                    syncToSheets({ action: 'appendNote', note: newNote });
                }
                showToast('Catatan ditambahkan!');
            }

            localStorage.setItem('app_notes', JSON.stringify(notes));
            renderAll();
            closeNoteModal();
        }

        function deleteNote(id) {
            const isSyncActive = syncUrl && syncUrl.trim() !== '';
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('app_notes', JSON.stringify(notes));
            if (isSyncActive && id) {
                syncToSheets({ action: 'deleteNote', id });
            }
            renderAll();
            showToast('Catatan dihapus!');
        }

        function togglePinNote(id) {
            const n = notes.find(x => x.id === id);
            if (n) { 
                n.pinned = !n.pinned; 
                localStorage.setItem('app_notes', JSON.stringify(notes));
                if (syncUrl && syncUrl.trim() !== '' && n.id) {
                    syncToSheets({ action: 'updateNote', note: n });
                }
                renderAll(); 
            }
        }

        function openTaskModal() {
            document.getElementById('taskForm').reset();
            taskAttachmentFiles = [];
            renderFilePreviews('task');
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeTaskModal() { document.getElementById('taskModal').classList.add('hidden'); }

        function handleSaveTask(e) {
            e.preventDefault();
            const isSyncActive = syncUrl && syncUrl.trim() !== '';
            const newTask = {
                id: isSyncActive ? ('TASK-' + Date.now()) : '',
                text: document.getElementById('taskText').value,
                completed: false,
                dueDate: document.getElementById('taskDueDate').value,
                priority: document.getElementById('taskPriority').value,
                attachments: [...taskAttachmentFiles],
                createdAt: new Date().toLocaleString()
            };
            tasks.unshift(newTask);
            localStorage.setItem('app_tasks', JSON.stringify(tasks));
            if (isSyncActive) {
                syncToSheets({ action: 'appendTask', task: newTask });
            }
            renderAll();
            closeTaskModal();
            showToast('Tugas ditambahkan!');
        }

        function toggleTask(id) {
            const t = tasks.find(x => x.id === id);
            if (t) { t.completed = !t.completed; localStorage.setItem('app_tasks', JSON.stringify(tasks)); renderAll(); }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('app_tasks', JSON.stringify(tasks));
            renderAll();
            showToast('Tugas dihapus!');
        }

        function openSyncModal() {
            document.getElementById('scriptUrlInput').value = syncUrl;
            document.getElementById('syncStatusLog').textContent = syncUrl ? 'Terhubung' : 'Belum diatur';
            document.getElementById('syncModal').classList.remove('hidden');
        }

        function closeSyncModal() { document.getElementById('syncModal').classList.add('hidden'); }
        
        function saveSyncSettings() {
            syncUrl = document.getElementById('scriptUrlInput').value.trim();
            localStorage.setItem('app_script_url', syncUrl);
            updateSyncIndicator();
            closeSyncModal();
            showToast('Pengaturan Sync disimpan!');
        }

        function renderAll() {
            document.getElementById('statNotesCount').textContent = notes.length;
            document.getElementById('statTasksCount').textContent = tasks.filter(t => t.completed).length;
            document.getElementById('statPinnedCount').textContent = notes.filter(n => n.pinned).length;
            
            const totalAtt = notes.reduce((a,b)=>a+(b.attachments?.length||0),0) + tasks.reduce((a,b)=>a+(b.attachments?.length||0),0);
            document.getElementById('statAttachmentsCount').textContent = totalAtt;

            if (currentTab === 'notes') renderNotes();
            else renderTasks();
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            const empty = document.getElementById('emptyState');
            let filtered = notes.filter(n => n.title.toLowerCase().includes(searchQuery.toLowerCase()) || n.content.toLowerCase().includes(searchQuery.toLowerCase()));
            filtered.sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));

            if (filtered.length === 0) { container.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            container.innerHTML = filtered.map(n => `
                <div class="bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <div>
                                ${n.id ? `<span class="text-[10px] font-mono text-slate-400 dark:text-slate-500">${n.id}</span>` : ''}
                                <h3 class="font-bold text-slate-800 dark:text-slate-100">${escapeHtml(n.title)}</h3>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <button onclick="openNoteModal('${n.id}')" class="text-slate-400 hover:text-amber-500"><i class="fas fa-edit"></i></button>
                                <button onclick="togglePinNote('${n.id}')" class="${n.pinned ? 'text-amber-500' : 'text-slate-300'}"><i class="fas fa-thumbtack"></i></button>
                            </div>
                        </div>
                        <p class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line mb-3">${escapeHtml(n.content)}</p>
                    </div>
                    <div>
                        ${renderAttachmentsHTML(n.attachments)}
                        <div class="flex items-center justify-between pt-3 mt-3 border-t border-slate-100 dark:border-slate-700 text-xs">
                            <span class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${n.category}</span>
                            <button onclick="deleteNote('${n.id}')" class="text-rose-500"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            const empty = document.getElementById('emptyState');
            let filtered = tasks.filter(t => t.text.toLowerCase().includes(searchQuery.toLowerCase()));

            if (filtered.length === 0) { container.innerHTML = ''; empty.classList.remove('hidden'); return; }
            empty.classList.add('hidden');

            container.innerHTML = filtered.map(t => `
                <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.id}')" class="w-4 h-4 text-amber-500 rounded">
                        <div>
                            ${t.id ? `<span class="text-[10px] font-mono text-slate-400 block">${t.id}</span>` : ''}
                            <span class="text-sm ${t.completed ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100'}">${escapeHtml(t.text)}</span>
                        </div>
                    </div>
                    <button onclick="deleteTask('${t.id}')" class="text-rose-500 text-xs"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2000);
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
